name: "Release"

on:
  release:
    types:
      - "published"
      - "released"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Adjust version number"
        shell: "bash"
        run: |
          yq -i -o json '.version="${{ github.event.release.tag_name }}"' \
            "${{ github.workspace }}/custom_components/kidde/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/kidde"
          zip kidde.zip -r ./

      - name: "Attest build provenance"
        uses: "actions/attest-build-provenance@v4.2.2"
        with:
          subject-path: "${{ github.workspace }}/custom_components/kidde/kidde.zip"

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ github.workspace }}/custom_components/kidde/kidde.zip
